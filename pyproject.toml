[project]
name = "attention-benchmarks"
version = "0.1.0"
description = "Sparse decode attention versions and universal synthetic benchmarks"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.2",
    "mlflow>=3.17.2",
    "numpy==2.5.4",
    "polars",
    "torch==2.14.1",
    "transformers==5.19.0",
]

[dependency-groups]
dev = ["ipykernel", "ipywidgets", "mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention", "src/benchmarks", "src/common", "src/nanogpt"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["N812"]  # torch's `functional as F`

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["triton", "triton.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
